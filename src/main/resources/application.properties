spring.application.name=cadastro-usuario

spring.datasource.url=jdbc:h2:mem:usuarios;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.data.web.pageable.max-page-size=100

# Segredo HS256 do JWT. O default serve só para desenvolvimento; em outros ambientes use a variável de ambiente.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
# Validade do token em segundos (1 hora).
app.security.jwt.expiration-seconds=3600
